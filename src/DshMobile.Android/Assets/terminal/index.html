<!doctype html>
<!-- PR-06 C# terminal page. Served only by CSharpTerminalActivity's asset interceptor from
     https://appassets.androidplatform.net/terminal/ ; every other request is refused. No network, no storage. -->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #terminal { position: absolute; inset: 0 0 0 4px; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-search.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="vendor/addon-unicode11.js"></script>
  <script src="terminal-core.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
