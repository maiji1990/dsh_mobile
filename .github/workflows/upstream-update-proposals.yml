name: upstream-update-proposals

# Nightly separately pinned upstream upgrade PRs; PR author must trigger real checks.
on:
  schedule:
    - cron: '18 3 * * *'
  # After verified immutable releases have been published on main, immediately
  # propose syncing their digests and the signed-channel preview spec.
  workflow_run:
    workflows: [runtime-layers]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: 'Which independent upgrade to check'
        type: choice
        options: [all, runtime, dsh, assets]
        required: true
        default: all
permissions:
  contents: read
concurrency:
  group: upstream-update-proposals
  cancel-in-progress: false
jobs:
  propose:
    # A workflow_run only proposes asset reconciliation if the upstream Release
    # pipeline actually succeeded. PR / dispatch still run with normal review.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [runtime, dsh, assets]
    steps:
      - name: Require a token capable of triggering PR checks
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_run' && matrix.component == 'assets') || inputs.component == 'all' || inputs.component == matrix.component
        env:
          PR_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
        run: |
          if [ -z "$PR_TOKEN" ]; then
            echo '::error::Set UPDATE_PR_TOKEN with Contents and Pull requests write access; default GITHUB_TOKEN does not trigger PR CI.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Detect and pin upstream version
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_run' && matrix.component == 'assets') || inputs.component == 'all' || inputs.component == matrix.component
        env:
          # Release digests of this repository are read through api.github.com, which answers 403 to anonymous calls
          # once the shared runner IP exhausts 60 requests/hour (2026-11-19). The token only covers this repository;
          # upstream tag lists come from git ls-remote, which needs no credentials.
          GITHUB_TOKEN: ${{ github.token }}
        run: node tooling/update-upstream.mjs --component '${{ matrix.component }}'
      - name: Create reviewable PR
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_run' && matrix.component == 'assets') || inputs.component == 'all' || inputs.component == matrix.component
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN }}
          branch: automation/upstream-${{ matrix.component }}
          base: main
          delete-branch: true
          commit-message: "build: propose pinned ${{ matrix.component }} upstream update"
          title: "build(${{ matrix.component }}): pinned upstream update proposal"
          body: |
            Automated proposal, not an approved or published upgrade.
            Component: ${{ matrix.component }}. Each component is reviewed and merged separately.
            Upstream metadata, package-lock and SHA-256 are pinned exactly.
            Review the changes, run ARM64 reproducibility + smoke + Android tests.
            Releases are immutable; stable publication requires signed approval and device evidence.
          add-paths: |
            runtime-bundle/runtime-build.lock
            runtime-bundle/runtime-assets.lock
            release/preview.json
            runtime-bundle/dsh/package.json
            runtime-bundle/dsh/package-lock.json
            docs/UPSTREAMS.md
