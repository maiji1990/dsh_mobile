# Inputs of the self-built runtime layers (ADR-0020), read by runtime-bundle/build-runtime.sh.
# KEY=VALUE, no spaces around '='. Changing a version here is an upstream upgrade: separate PR (AGENTS.md rule 8).

BUNDLE_NAME=dshmobile-runtime-debian-arm64
BUNDLE_VERSION=0.2.1
ARCH=arm64

# Debian base (mmdebstrap minbase). The snapshot fixes package versions and SOURCE_DATE_EPOCH.
DEBIAN_SUITE=trixie
DEBIAN_SNAPSHOT=20261110T000000Z
# Based on DSHBox v1.5.1 package set; libatomic1 is required by the official Node.js 26 arm64 binary.
DEBIAN_PACKAGES=ca-certificates,curl,wget,openssl,git,openssh-client,rsync,coreutils,util-linux,procps,findutils,grep,sed,gawk,diffutils,tar,gzip,bzip2,xz-utils,zip,unzip,file,less,python3,python3-pip,python3-venv,locales,tzdata,apt-utils,libatomic1
# The guest's own apt source after the build (owner decision: keep the Tsinghua mirror, as DSHBox did).
GUEST_APT_SOURCE=deb https://mirrors.tuna.tsinghua.edu.cn/debian trixie main

# Node layer: official build, SHA-256 from https://nodejs.org/dist/v26.13.1/SHASUMS256.txt
NODE_VERSION=26.13.1
NODE_SHA256=89e1853138db51e8b82d3e98ba9c0d3f2956a28e5e55ea1b7e12d25aae92d5dd

# DSH layer: npm ci of runtime-bundle/dsh/{package.json,package-lock.json} (lock taken from the DSHBox v1.5.1 DSH layer).
DSH_VERSION=0.2.2-rc.5
DSH_PACKAGE_JSON_SHA256=77d0e13205d92db5c3a2239151656ceccaf16f50926ab22e299548209f4cc6f9
DSH_PACKAGE_LOCK_SHA256=f8a2c78ce6a3df90d12246b251ae0b5c98804c7eabd58a8b1952d16fe32e1d4f

ZSTD_LEVEL=19
